<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Link in Bio</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f97316;
      --accent-hover: #ea580c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: color-mix(in srgb, var(--card) 90%, black 10%);
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 2px solid #475569;
      display: block;
      margin: 0 auto 14px;
      object-fit: cover;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 1.7rem;
    }

    p {
      text-align: center;
      color: var(--muted);
      margin: 10px 0 22px;
      line-height: 1.5;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .btn {
      display: block;
      text-decoration: none;
      text-align: center;
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 700;
      background: #1f2937;
      color: var(--text);
      border: 1px solid #334155;
      transition: transform .15s ease, background .15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: #273549;
    }

    .btn.gumroad {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .btn.gumroad:hover {
      background: var(--accent-hover);
    }

    .note {
      font-size: .85rem;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="avatar" src="https://images.unsplash.com/photo-1527980965255-d3b416303d12?auto=format&fit=crop&w=200&q=80" alt="Profile picture" />
    <h1>@yourname</h1>
    <p>Digital creator • Tutorials • Downloads</p>

    <div class="links">
      <a class="btn gumroad" href="https://gumroad.com/your-gumroad-username" target="_blank" rel="noopener">🛍️ Shop on Gumroad</a>
      <a class="btn" href="https://instagram.com/yourhandle" target="_blank" rel="noopener">Instagram</a>
      <a class="btn" href="https://youtube.com/@yourchannel" target="_blank" rel="noopener">YouTube</a>
      <a class="btn" href="mailto:you@example.com">Email</a>
    </div>

    <p class="note">Tip: Replace each placeholder link, name, and profile image, then publish this file with GitHub Pages, Netlify, or Vercel for a free live URL.</p>
  </main>
</body>
</html>
